name: Publish sample to GitHub Pages

# Compiles Tesserae.A2UI.Sample in Release and publishes the Transpose output folder to the
# `gh-pages` branch. Enable Pages for this repo with Settings -> Pages -> "Deploy from a branch" ->
# branch `gh-pages` / root.
#
# The Transpose output folder *is* the site: `tps.json` emits an index.html that pulls every script with a
# relative path, so there is nothing to rewrite for the /tesserae-a2ui/ sub-path Pages serves from.

on:
  push:
    branches: [main]
    # Only rebuild the site when something that affects it changes.
    paths:
      - 'Tesserae.A2UI/**'
      - 'Tesserae.A2UI.Sample/**'
      - 'Tesserae.A2UI.slnx'
      - 'scripts/make-sample-examples.mjs'
      - 'scripts/stage-samples.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# Allow the workflow to push to the gh-pages branch.
permissions:
  contents: write

# Never run two deploys at once; let the latest win.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.x

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install the Transpose compiler
        run: |
          dotnet tool update --global Transpose.Compiler
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Release matters: Transpose only selects the .min.js resource set there, so a Debug build
      # would publish a site that never exercises the minified variants.
      - name: Build the sample (Release)
        run: dotnet build Tesserae.A2UI.Sample/Tesserae.A2UI.Sample.csproj -c Release

      - name: Stage the site
        run: node scripts/stage-samples.mjs

      - name: Publish _site/ to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # A .nojekyll file is added so paths like /assets/ are served verbatim.
          enable_jekyll: false
          commit_message: 'Deploy sample for ${{ github.sha }}'
